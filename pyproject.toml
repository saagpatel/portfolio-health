[project]
name = "portfolio-health"
version = "0.1.0"
description = "MCP server for project portfolio health — FTS5 index of memory files + bridge-db activity"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
portfolio-health = "portfolio_health.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend = "../ruff.toml"

[tool.ruff.lint]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_health"]
